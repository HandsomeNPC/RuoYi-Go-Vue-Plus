# nginx 按模块负载均衡：每个模块一个 upstream，热点模块挂多实例。
# 注意：本配置面向本地 go run 部署(127.0.0.1)。
#   - 各业务进程路由不含 /auth、/system 前缀(见 internal/<module>/router.go 的 RegisterRoutes(...,""))，
#     由 nginx 在 location 里剥前缀(proxy_pass 末尾带 /)后转发。
#   - standalone 部署(go run ./cmd/standalone :8080)自带 /auth、/system 前缀，无需 nginx，可直接对外。
upstream auth_backend {
    server 127.0.0.1:9210;
}

upstream system_backend {
    least_conn;
    server 127.0.0.1:9201;
    # server 127.0.0.1:9202;   # 第二个 system 实例(本地需另起，端口覆盖见环境变量)
}

# WebSocket 握手要求把 Upgrade 头透传给后端。$connection_upgrade 在非升级请求上
# 取 close，避免给普通 HTTP 请求也挂上 Upgrade。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # proxy_pass 末尾的 / 会把匹配到的 /auth/ 前缀替换为 /，后端收到 /login、/logout ...
    location /auth/ {
        proxy_pass         http://auth_backend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /system/ {
        proxy_pass         http://system_backend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 消息盒子与推送端点(SSE/WebSocket)。这些路由在后端不带模块前缀
    # (对齐原项目的 /resource/*)，故 proxy_pass 末尾不带 / ——不能剥前缀。
    location /resource/ {
        proxy_pass         http://system_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket 升级所需；HTTP/1.1 是长连接的前提(默认 1.0 会关掉 keep-alive)。
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # 长连接期间可能长时间无数据(SSE 心跳 60s 一次)，默认 60s 读超时会把
        # 连接掐断，须调到大于心跳间隔；这里给到 SSE 的超时上限 24h。
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 关掉响应缓冲：否则 SSE 消息会被攒在 nginx 里直到缓冲写满才下发，
        # 表现为前端"收不到推送"。后端也发了 X-Accel-Buffering: no，双保险。
        proxy_buffering    off;
        proxy_cache        off;
    }
}
