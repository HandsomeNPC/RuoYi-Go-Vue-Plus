# nginx 按模块负载均衡：每个模块一个 upstream，热点模块挂多实例。
# 注意：本配置面向本地 go run 部署(127.0.0.1)。
#   - 各业务进程路由不含 /auth、/system 前缀(见 internal/<module>/router.go 的 RegisterRoutes(...,""))，
#     由 nginx 在 location 里剥前缀(proxy_pass 末尾带 /)后转发。
#   - standalone 部署(go run ./cmd/standalone :8080)自带 /auth、/system 前缀，无需 nginx，可直接对外。
upstream auth_backend {
    server 127.0.0.1:9210;
}

upstream system_backend {
    least_conn;
    server 127.0.0.1:9201;
    # server 127.0.0.1:9202;   # 第二个 system 实例(本地需另起，端口覆盖见环境变量)
}

server {
    listen 80;
    server_name localhost;

    # proxy_pass 末尾的 / 会把匹配到的 /auth/ 前缀替换为 /，后端收到 /login、/logout ...
    location /auth/ {
        proxy_pass         http://auth_backend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /system/ {
        proxy_pass         http://system_backend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
