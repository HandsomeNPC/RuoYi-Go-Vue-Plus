# 一键拉起：auth + 2×system + resource + nginx + mysql + redis。共用同一 DB。
# docker compose -f deploy/docker-compose.yaml up --build
services:
  auth:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { MODULE: auth } }
    expose: [ "8080" ]
    volumes: [ "../configs:/app/configs:ro" ]
    depends_on: [ mysql, redis ]

  system-1:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { MODULE: system } }
    expose: [ "8081" ]
    volumes: [ "../configs:/app/configs:ro" ]
    depends_on: [ mysql, redis ]

  system-2:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { MODULE: system } }
    expose: [ "8181" ]
    environment: [ SERVER_ADDR=:8181 ]
    volumes: [ "../configs:/app/configs:ro" ]
    depends_on: [ mysql, redis ]

  # 文件存储 + 消息盒子 + 推送。上传要连对象存储，本地需另起 MinIO
  # (sys_oss_config 的 minio 那行 endpoint 指向 127.0.0.1:9000，容器内需改成服务名)。
  resource:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { MODULE: resource } }
    expose: [ "9203" ]
    volumes: [ "../configs:/app/configs:ro" ]
    depends_on: [ mysql, redis ]

  nginx:
    image: nginx:stable-alpine
    ports: [ "80:80" ]
    volumes: [ "./nginx.conf:/etc/nginx/conf.d/default.conf:ro" ]
    depends_on: [ auth, system-1, system-2, resource ]

  mysql:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: ry-vue }
    ports: [ "3306:3306" ]
    volumes: [ "mysql-data:/var/lib/mysql" ]

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]

volumes:
  mysql-data:
