# auth 进程自包含配置。datasource/redis/satoken/apiEncrypt/user 与其它进程相同值——
# 拆开各管各的是要隔离部署，改环境值时同步改多份是已知代价。
server:
  name: auth
  # 各模块统一 8080：容器间网络命名空间隔离，端口由 nginx / compose 侧区分。
  # 代价是本机 go run 起多个 modular 进程会抢端口，本地多进程调试需临时改这里。
  addr: ":8080"

# 各进程共用同一个库，workerId 必须互不相同，否则雪花主键会撞号。
# 分配：auth=1 system=2 monitor=3 resource=4 standalone=0
snowflake:
  workerId: 1
  datacenterId: 0

datasource:
  primary: master          # 默认数据源名，DB() 返回它
  strict: true             # 匹配不到数据源则报错，否则回退 primary
  datasource:
    # 主库数据源
    master:
      type: mysql
      # GORM MySQL DSN；原 params 的 query 段并入此 url
      url: "root:ruoyi123@tcp(127.0.0.1:3306)/ry-cloud?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s"
      maxIdleConns: 10
      maxOpenConns: 100
      connMaxLifetime: 3600   # 连接最大存活(秒)
      connMaxIdleTime: 600    # 空闲连接最大存活(秒)
      logLevel: warn          # silent/error/warn/info
      slowThresholdMs: 200    # 慢 SQL 阈值(毫秒)
#    # 从库数据源示例（lazy: 首次 DBByName 才建连）
#    slave:
#      lazy: true
#      type: mysql
#      url: "root:ruoyi123@tcp(127.0.0.1:3306)/ry-vue?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  host: 127.0.0.1
  port: 6379
  password: ruoyi123
  db: 0
  clientName: ruoyi-go        # 便于 CLIENT LIST 排查
  poolSize: 32
  minIdleConns: 8
  dialTimeoutMs: 5000
  readTimeoutMs: 3000
  writeTimeoutMs: 3000
  connMaxIdleTime: 600        # 空闲连接最大存活(秒)

# sa-token-go 鉴权配置
satoken:
  tokenName: Authorization          # 读取 token 的请求头名(对应 sa-token.token-name)
  isConcurrent: true                # 允许同一账号并发登录(多端在线)
  isShare: false                    # 多端登录是否共享同一 token
  jwtSecretKey: abcdefghijklmnopqrstuvwxyz # jwt秘钥
  # 下面三项是兜底默认值。实际超时按 sys_client 表的 timeout / active_timeout 列
  # 逐客户端下发(pc / app / 小程序可各不相同)，须 dynamicActiveTimeout=true 才生效。
  timeout: 604800                   # token 固定有效期(秒)，绝对上限，到点必失效，-1 永不过期
  activeTimeout: 1800               # token 最低活跃频率(秒)，空闲超此时长即冻结，-1 不限制
  dynamicActiveTimeout: true        # 允许按客户端覆盖上面两项

user:
  password:
    maxRetryCount: 5          # 达到即锁定
    lockTime: 10              # 锁定时长(分钟)

# 是否开启全局接口加密
apiEncrypt:
  enabled: true
  # AES 加密头标识
  headerFlag: encrypt-key
  # 响应加密公钥
  publicKey: MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDm6u8q8X78onmbU4wGMq3b4ufbWE18YzuWo5jwkUlwWPTPcENbZYtveyTepp2Od1CTDcjhTUmVYvFkhaCF46UfOxZrwoSZc3jf3WXXd0hLOPBHuulynknj2KsWvKDuRig7J2o4KbDhyl0nnlUiMrIiD0tv1rBKpNCJ/T+MN0bERQIDAQAB
  # 请求解密私钥
  privateKey: 

# 验证码配置
captcha:
  enable: true             # 是否启用验证码校验
  type: math                 # 验证码类型 math 算术计算 char 字符验证
  charLength: 4             # 字符验证码的字符个数

# 三方登录配置。对照原项目 justauth 段。
# 未填 clientId/clientSecret 的平台一律视为未启用，/auth/binding/{source}
# 返回「xx平台账号暂支持」（与原项目 AuthChecker.isSupportedAuth 同口径）。
# redirectUri 指向前端回调页，须与平台控制台登记的地址完全一致。
social:
  type:
    gitee:
      clientId: ""
      clientSecret: ""
      redirectUri: http://localhost:80/social-callback?source=gitee
    github:
      clientId: ""
      clientSecret: ""
      redirectUri: http://localhost:80/social-callback?source=github
    # maxkey / topiam 为私有化部署，端点由 serverUrl 拼出，故必须填。
    maxkey:
      serverUrl: http://sso.maxkey.top
      clientId: ""
      clientSecret: ""
      redirectUri: http://localhost:80/social-callback?source=maxkey
    topiam:
      serverUrl: ""
      clientId: ""
      clientSecret: ""
      redirectUri: http://localhost:80/social-callback?source=topiam
      scopes: [ openid, profile, email ]

# cors/xss/accessLog/traceId/repeatableBody 走 Go 默认（DefaultX 兜底），auth 无富文本路由，无需 xss 覆盖。
