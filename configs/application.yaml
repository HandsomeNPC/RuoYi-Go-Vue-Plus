# 公共配置：所有进程共享。各进程独有配置(端口)在 <模块>.yaml 覆盖。
datasource:
  driver: mysql
  host: 127.0.0.1
  port: 3306
  username: root
  password: ruoyi123
  dbname: ry-cloud
  params: charset=utf8mb4&parseTime=True&loc=Local&timeout=5s
  maxIdleConns: 10
  maxOpenConns: 100
  connMaxLifetime: 3600   # 连接最大存活(秒)
  connMaxIdleTime: 600    # 空闲连接最大存活(秒)
  logLevel: warn          # silent/error/warn/info
  slowThresholdMs: 200    # 慢 SQL 阈值(毫秒)

redis:
  host: 127.0.0.1
  port: 6379
  password: ruoyi123
  db: 0
  clientName: ruoyi-go        # 便于 CLIENT LIST 排查
  poolSize: 32
  minIdleConns: 8
  dialTimeoutMs: 5000
  readTimeoutMs: 3000
  writeTimeoutMs: 3000
  connMaxIdleTime: 600        # 空闲连接最大存活(秒)

# sa-token-go 鉴权配置
satoken:
  tokenName: Authorization          # 读取 token 的请求头名(对应 sa-token.token-name)
  isConcurrent: true                # 允许同一账号并发登录(多端在线)
  isShare: false                    # 多端登录是否共享同一 token
  jwtSecretKey: abcdefghijklmnopqrstuvwxyz # jwt秘钥


user:
  password:
    maxRetryCount: 5          # 达到即锁定
    lockTime: 10              # 锁定时长(分钟)

cors:
  allowCredentials: true          # 允许携带 cookie / Authorization
  allowedOriginPatterns: [ "*" ]    # 支持 * 通配，如 https://*.example.com；命中后回显 Origin
  allowedMethods: [ "*" ]           # 回显预检请求的方法
  allowedHeaders: [ "*" ]           # 回显预检请求的头
  exposedHeaders: # 允许前端 JS 读取的响应头
    - X-Request-Id                # 给前端才能拿到 traceId 对账
  maxAgeSeconds: 1800           # 预检结果缓存(秒)

xss:
  excludeUrls: # 跳过清洗的路径，Ant 风格(? 单字符 / * 单层 / ** 任意层)
    - /system/notice              # 富文本公告，清洗会破坏内容
    - /warm-flow/save-json        # 流程定义 JSON，需原样存标签
  skipMethods: [ GET, DELETE ]      # REST 语义不携带落库内容

accessLog:
  maxParamLength: 4000            # 参数日志最大字符数(rune)，<=0 用默认 4000
  # skipPaths:                    # 不打日志的路径(精确匹配)，给探针这类高频零信息请求用
  #   - /system/ping              # 默认不排除任何路径

traceId:
  header: X-Request-Id            # 与 cors.exposedHeaders 配套
  trustInbound: true              # 沿用上游 nginx/网关生成的 id；进程直接暴露公网时应关掉

repeatableBody:
  contentTypes: # 需缓存的 content-type 前缀，大小写不敏感
    - application/json            # 不要加 multipart/form-data —— 会把上传文件读进内存
  maxBodySize: 10485760           # 10MB，超出直接拒绝(不截断)

i18n:
  header: content-language        # 对齐原项目，非 Accept-Language(详见 pkg/config/middleware_i18n.go)
  default: zh-cn                  # 未指定或不合规时使用

apiEncrypt:
  # 是否开启全局接口加密
  enabled: true
  # AES 加密头标识
  headerFlag: encrypt-key
