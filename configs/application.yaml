# 公共配置：所有进程共享。各进程独有配置(端口)在 <模块>.yaml 覆盖。
datasource:
  driver: mysql
  host: 127.0.0.1
  port: 3306
  username: root
  password: ruoyi123
  dbname: ry-cloud
  params: charset=utf8mb4&parseTime=True&loc=Local&timeout=5s
  maxIdleConns: 10
  maxOpenConns: 100
  connMaxLifetime: 3600   # 连接最大存活(秒)
  connMaxIdleTime: 600    # 空闲连接最大存活(秒)
  logLevel: warn          # silent/error/warn/info
  slowThresholdMs: 200    # 慢 SQL 阈值(毫秒)

redis:
  host: 127.0.0.1
  port: 6379
  password: ruoyi123
  db: 0
  clientName: ruoyi-go        # 便于 CLIENT LIST 排查
  poolSize: 32
  minIdleConns: 8
  dialTimeoutMs: 5000
  readTimeoutMs: 3000
  writeTimeoutMs: 3000
  connMaxIdleTime: 600        # 空闲连接最大存活(秒)

jwt:
  # 签名密钥，对应原项目 sa-token.jwt-secret-key。
  # 两个进程必须配同一个值，否则 auth 签的 token 在 system 那边验不过(登录成功但接口 401)。
  secret: change-me-in-production
  # 以下两项当前不生效，详见 pkg/config/jwt.go：
  #   expireMinutes -> 实际取 sys_client.timeout(7 天)，对齐原项目
  #   header        -> 已由 middleware.auth.header 承担
  expireMinutes: 720
  header: Authorization

# 用户业务配置，对应原项目 application.yml 的 user 段。
# 不放进 middleware 段：密码重试作用在登录 service，与 HTTP 无关；短信/邮箱登录也复用此限制。
user:
  password:
    maxRetryCount: 5          # 达到即锁定
    lockTime: 10              # 锁定时长(分钟)，同时是 pwd_err_cnt:<username> 的 TTL
    # 每次失败都重置 TTL(滑动窗口)：每 9 分钟错一次、错满 5 次跨越 40 分钟依然会锁。

# 全局中间件。除 apiEncrypt 外，均为代码默认值(pkg/config.DefaultMiddleware)的显式重述，
# 由 config 包测试锁住一致性。除 apiEncrypt 外不带 enabled 开关 —— 注册即生效(r.Use)，
# 不写即关闭。
# 不要放进 system.yaml / auth.yaml：拆进程后请求经 nginx 落点不定，两入口行为必须一致。
middleware:
  cors:
    allowCredentials: true          # 允许携带 cookie / Authorization
    allowedOriginPatterns: [ "*" ]    # 支持 * 通配，如 https://*.example.com；命中后回显 Origin
    allowedMethods: [ "*" ]           # 回显预检请求的方法
    allowedHeaders: [ "*" ]           # 回显预检请求的头
    exposedHeaders: # 允许前端 JS 读取的响应头
      - X-Request-Id                # 给前端才能拿到 traceId 对账
    maxAgeSeconds: 1800           # 预检结果缓存(秒)

  xss:
    excludeUrls: # 跳过清洗的路径，Ant 风格(? 单字符 / * 单层 / ** 任意层)
      - /system/notice              # 富文本公告，清洗会破坏内容
      - /warm-flow/save-json        # 流程定义 JSON，需原样存标签
    skipMethods: [ GET, DELETE ]      # REST 语义不携带落库内容

  accessLog:
    maxParamLength: 4000            # 参数日志最大字符数(rune)，<=0 用默认 4000
    # skipPaths:                    # 不打日志的路径(精确匹配)，给探针这类高频零信息请求用
    #   - /system/ping              # 默认不排除任何路径

  traceId:
    header: X-Request-Id            # 与 cors.exposedHeaders 配套
    trustInbound: true              # 沿用上游 nginx/网关生成的 id；进程直接暴露公网时应关掉

  repeatableBody:
    contentTypes: # 需缓存的 content-type 前缀，大小写不敏感
      - application/json            # 不要加 multipart/form-data —— 会把上传文件读进内存
    maxBodySize: 10485760           # 10MB，超出直接拒绝(不截断)

  i18n:
    header: content-language        # 对齐原项目，非 Accept-Language(详见 pkg/config/middleware.go)
    default: zh-cn                  # 未指定或不合规时使用

  # 鉴权，对应原项目 SecurityConfig + sa-token。键路径为 middleware.auth.*，
  # 因 Go 侧中间件配置统一收在 middleware 段下、一个中间件一个文件。
  auth:
    header: Authorization           # 对应 sa-token.token-name
    tokenPrefix: Bearer             # 对应 sa-token.token-prefix；空串表示不用前缀(裸 token)
    clientIdHeader: clientid        # 对应 LoginHelper.CLIENT_KEY
    # token 只从 header 取(不接受查询串/cookie)：查询串会进 nginx accesslog 与浏览器历史，
    # cookie 会引入 CSRF(原项目 is-read-cookie: false 即刻意关掉)。
    excludes: # 免鉴权路径，Ant 风格
      # 前 11 条逐字对应原项目 security.excludes(application.yml:100-113)。
      - /*.html                     # Ant 下 * 不跨分隔符：本条匹配 /index.html
      - /**/*.html                  # 匹配 /static/a/index.html
      - /**/*.css
      - /**/*.js
      - /favicon.ico
      - /error
      - /*/api-docs
      - /*/api-docs/**
      - /warm-flow-ui/config
      - /snail-chat/**
      - /api/snail/chat/**
      # 必要新增：原项目 AuthController 整个类挂 @SaIgnore 免鉴权，Go 无注解只能进此名单。
      - /auth/**

  # 接口加解密，对应原项目 api-decrypt 段(application.yml:148-158)。
  # 唯一带 enabled 的中间件：不生效时带 encrypt-key 头的请求会被当明文，报出无关的参数错误，
  # 必须能区分「没开」与「开了但密钥错」。
  # 也是唯一与代码默认值不同的一节(默认 enabled=false)。默认值要在「无配置文件」时也讲得通，
  # 而 enabled=true + 空私钥会让任何未配置进程启动失败。此差异由 config 包测试锁住。
  # 协议(两层 base64 套嵌是原项目既有约定，少一层就对不上前端)：
  #   encrypt-key 头 = base64(RSA公钥加密( base64( AES明文密钥 ) ))
  #   请求体         = base64(AES-ECB加密( JSON 明文 ))
  apiEncrypt:
    enabled: true                   # 对齐原项目 application.yml:150
    headerFlag: encrypt-key         # 请求与响应共用同一头名，载荷方向不同
    requestUrls: # 强制加密接口(Ant 风格)；命中却没带密钥头 -> 拒绝
      # 对应原项目 4 处 @ApiEncrypt，都在传密码，列在这里防止「本该加密的接口收到明文密码」被静默放过。
      - /auth/login                    # AuthController.login
      - /auth/register                 # AuthController.register
      - /system/user/resetPwd          # SysUserController.resetPwd
      - /system/user/profile/updatePwd # SysProfileController.updatePwd
    # responseUrls:                 # 加密响应体，对应 @ApiEncrypt(response=true)。原项目全为 false，
    #   - /auth/login               # 即响应加密从未启用。开启前确认前端已实现响应解密，且 publicKey 已配。
    maxBodySize: 10485760           # 10MB 密文上限(密文 base64 后比明文约 4/3)

    # ⚠️ 以下密钥照抄原项目 application.yml，是上游公开的开发用密钥(1024 位，低于 2048 位建议)，
    # ⚠️ 照抄因配套公钥硬编码在现有前端里，换掉联调不通。上线前必须与前端一起换新密钥。
    # privateKey 解密请求(对应前端加密公钥)，格式 base64(PKCS#8 DER)。
    privateKey: 
    # publicKey 加密响应(对应前端解密私钥)，格式 base64(X.509 SPKI)。仅在配了 responseUrls 时用到。
    publicKey: MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDm6u8q8X78onmbU4wGMq3b4ufbWE18YzuWo5jwkUlwWPTPcENbZYtveyTepp2Od1CTDcjhTUmVYvFkhaCF46UfOxZrwoSZc3jf3WXXd0hLOPBHuulynknj2KsWvKDuRig7J2o4KbDhyl0nnlUiMrIiD0tv1rBKpNCJ/T+MN0bERQIDAQAB
