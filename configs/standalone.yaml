# standalone 单体进程自包含配置（auth+system+monitor+resource 同进程）。
# 需要四模块全部子配置。datasource/redis/satoken/apiEncrypt 与各 modular 进程相同值。
server:
  name: standalone
  addr: ":8080"

# 单体进程独占，用默认 0 即可；若与 modular 进程同时连同一个库，需改成未占用的值。
# 分配：auth=1 system=2 resource=3 monitor=4 standalone=0
snowflake:
  workerId: 0
  datacenterId: 0

datasource:
  primary: master          # 默认数据源名，DB() 返回它
  strict: true             # 匹配不到数据源则报错，否则回退 primary
  datasource:
    # 主库数据源
    master:
      type: mysql
      # GORM MySQL DSN；原 params 的 query 段并入此 url
      url: "root:ruoyi123@tcp(127.0.0.1:3306)/ry-cloud?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s"
      maxIdleConns: 10
      maxOpenConns: 100
      connMaxLifetime: 3600   # 连接最大存活(秒)
      connMaxIdleTime: 600    # 空闲连接最大存活(秒)
      logLevel: warn          # silent/error/warn/info
      slowThresholdMs: 200    # 慢 SQL 阈值(毫秒)
#    # 从库数据源示例（lazy: 首次 DBByName 才建连）
#    slave:
#      lazy: true
#      type: mysql
#      url: "root:ruoyi123@tcp(127.0.0.1:3306)/ry-vue?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  host: 127.0.0.1
  port: 6379
  password: ruoyi123
  db: 0
  clientName: ruoyi-go        # 便于 CLIENT LIST 排查
  poolSize: 32
  minIdleConns: 8
  dialTimeoutMs: 5000
  readTimeoutMs: 3000
  writeTimeoutMs: 3000
  connMaxIdleTime: 600        # 空闲连接最大存活(秒)

# sa-token-go 鉴权配置
satoken:
  tokenName: Authorization          # 读取 token 的请求头名(对应 sa-token.token-name)
  isConcurrent: true                # 允许同一账号并发登录(多端在线)
  isShare: false                    # 多端登录是否共享同一 token
  jwtSecretKey: abcdefghijklmnopqrstuvwxyz # jwt秘钥

user:
  password:
    maxRetryCount: 5          # 达到即锁定
    lockTime: 10              # 锁定时长(分钟)

# 是否开启全局接口加密
apiEncrypt:
  enabled: true
  headerFlag: encrypt-key
  publicKey: MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDm6u8q8X78onmbU4wGMq3b4ufbWE18YzuWo5jwkUlwWPTPcENbZYtveyTepp2Od1CTDcjhTUmVYvFkhaCF46UfOxZrwoSZc3jf3WXXd0hLOPBHuulynknj2KsWvKDuRig7J2o4KbDhyl0nnlUiMrIiD0tv1rBKpNCJ/T+MN0bERQIDAQAB
  privateKey: 

# 验证码配置
captcha:
  enable: true             # 是否启用验证码校验
  type: math                 # 验证码类型 math 算术计算 char 字符验证
  charLength: 4             # 字符验证码的字符个数

# 三方登录配置
social:
  type:
    gitee:
      clientId: ""
      clientSecret: ""
      redirectUri: http://localhost:80/social-callback?source=gitee
    github:
      clientId: ""
      clientSecret: ""
      redirectUri: http://localhost:80/social-callback?source=github
    maxkey:
      serverUrl: http://sso.maxkey.top
      clientId: ""
      clientSecret: ""
      redirectUri: http://localhost:80/social-callback?source=maxkey
    topiam:
      serverUrl: ""
      clientId: ""
      clientSecret: ""
      redirectUri: http://localhost:80/social-callback?source=topiam
      scopes: [ openid, profile, email ]

# 消息推送配置（只移植 SSE，不支持 websocket）。
# 默认值与校验由 push.Init 兜底；enabled 缺省为 false，故必须显式开启。
push:
  enabled: true
  path: /message
  sseTimeoutSeconds: 86400
  heartbeatSeconds: 60
  sendBuffer: 32

# 邮件配置
mail:
  enabled: false
  host: smtp.qq.com
  port: 465
  ssl: true
  from: ""
  user: ""
  password: ""

# 短信配置(阿里云)。顶层 enabled 是总开关；顶层一开，凭证齐就建一个 dysmsapi 客户端。
# 签名 / 模板随业务变，按业务各挂子段：captcha 子段即登录验证码那条路径用的模板。
sms:
  enabled: false
  aliyun:
    accessKeyId: ""
    accessKeySecret: ""
    endpoint: dysmsapi.aliyuncs.com
    regionId: cn-hangzhou
  captcha: # 登录验证码用的签名+模板
    signName: ""
    templateCode: ""

# xss 排除：standalone 带 /system 前缀，公告路由是 /system/notice；同时列 /notice 以兼容。
xss:
  excludeUrls:
    - /system/notice              # 富文本公告，清洗会破坏内容(standalone 带前缀)
    - /notice                     # 同上，modular 部署经 nginx 剥前缀后无 /system
    - /warm-flow/save-json        # 流程定义 JSON，需原样存标签
  skipMethods: [ GET, DELETE ]

# cors/accessLog/traceId/repeatableBody 走 Go 默认（DefaultX 兜底）。
