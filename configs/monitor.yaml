# monitor 进程自包含配置。最瘦：只 datasource/redis/satoken + server/snowflake，
# 无 apiEncrypt/user/captcha/social/push/mail/sms。datasource/redis/satoken 与其它进程相同值。
server:
  name: monitor
  # 各模块统一 8080：容器间网络命名空间隔离，端口由 nginx / compose 侧区分。
  # 代价是本机 go run 起多个 modular 进程会抢端口，本地多进程调试需临时改这里。
  addr: ":8080"

# 各进程共用同一个库，workerId 必须互不相同，否则雪花主键会撞号。
# 分配：auth=1 system=2 resource=3 monitor=4 standalone=0
snowflake:
  workerId: 4
  datacenterId: 0

# monitor 进程既读 Redis（缓存监控、解锁删 pwd_err_cnt 锁定键），又落库读 MySQL
# （登录日志列表/删除/清空）。故需 database/snowflake/oplog/repeatsubmit：
# snowflake 供 oplog 落 sys_oper_log 发号，repeatsubmit 给 unlock 防重。
# 鉴权复用同一 Redis 中的 sa-token 会话，权限码 monitor:* 仍在登录时由 auth 进程写入。

datasource:
  primary: master          # 默认数据源名，DB() 返回它
  strict: true             # 匹配不到数据源则报错，否则回退 primary
  datasource:
    # 主库数据源
    master:
      type: mysql
      # GORM MySQL DSN；原 params 的 query 段并入此 url
      url: "root:ruoyi123@tcp(127.0.0.1:3306)/ry-cloud?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s"
      maxIdleConns: 10
      maxOpenConns: 100
      connMaxLifetime: 3600   # 连接最大存活(秒)
      connMaxIdleTime: 600    # 空闲连接最大存活(秒)
      logLevel: warn          # silent/error/warn/info
      slowThresholdMs: 200    # 慢 SQL 阈值(毫秒)
#    # 从库数据源示例（lazy: 首次 DBByName 才建连）
#    slave:
#      lazy: true
#      type: mysql
#      url: "root:ruoyi123@tcp(127.0.0.1:3306)/ry-vue?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  host: 127.0.0.1
  port: 6379
  password: ruoyi123
  db: 0
  clientName: ruoyi-go        # 便于 CLIENT LIST 排查
  poolSize: 32
  minIdleConns: 8
  dialTimeoutMs: 5000
  readTimeoutMs: 3000
  writeTimeoutMs: 3000
  connMaxIdleTime: 600        # 空闲连接最大存活(秒)

# sa-token-go 鉴权配置
satoken:
  tokenName: Authorization          # 读取 token 的请求头名(对应 sa-token.token-name)
  isConcurrent: true                # 允许同一账号并发登录(多端在线)
  isShare: false                    # 多端登录是否共享同一 token
  jwtSecretKey: abcdefghijklmnopqrstuvwxyz # jwt秘钥
  # 下面三项是兜底默认值。实际超时按 sys_client 表的 timeout / active_timeout 列
  # 逐客户端下发(pc / app / 小程序可各不相同)，须 dynamicActiveTimeout=true 才生效。
  timeout: 604800                   # token 固定有效期(秒)，绝对上限，到点必失效，-1 永不过期
  activeTimeout: 1800               # token 最低活跃频率(秒)，空闲超此时长即冻结，-1 不限制
  dynamicActiveTimeout: true        # 允许按客户端覆盖上面两项

# cors/xss/accessLog/traceId/repeatableBody 走 Go 默认（DefaultX 兜底），monitor 无富文本路由。
