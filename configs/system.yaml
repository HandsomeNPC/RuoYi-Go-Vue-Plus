# system 进程自包含配置。datasource/redis/satoken/apiEncrypt/user 与其它进程相同值——
# 拆开各管各的是要隔离部署，改环境值时同步改多份是已知代价。
server:
  name: system
  # 各模块统一 8080：容器间网络命名空间隔离，端口由 nginx / compose 侧区分。
  # 代价是本机 go run 起多个 modular 进程会抢端口，本地多进程调试需临时改这里。
  addr: ":8080"

# 各进程共用同一个库，workerId 必须互不相同，否则雪花主键会撞号。
# 分配：auth=1 system=2 monitor=3 resource=4 standalone=0
snowflake:
  workerId: 2
  datacenterId: 0

datasource:
  primary: master          # 默认数据源名，DB() 返回它
  strict: true             # 匹配不到数据源则报错，否则回退 primary
  datasource:
    # 主库数据源
    master:
      type: mysql
      # GORM MySQL DSN；原 params 的 query 段并入此 url
      url: "root:ruoyi123@tcp(127.0.0.1:3306)/ry-cloud?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s"
      maxIdleConns: 10
      maxOpenConns: 100
      connMaxLifetime: 3600   # 连接最大存活(秒)
      connMaxIdleTime: 600    # 空闲连接最大存活(秒)
      logLevel: warn          # silent/error/warn/info
      slowThresholdMs: 200    # 慢 SQL 阈值(毫秒)
#    # 从库数据源示例（lazy: 首次 DBByName 才建连）
#    slave:
#      lazy: true
#      type: mysql
#      url: "root:ruoyi123@tcp(127.0.0.1:3306)/ry-vue?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  host: 127.0.0.1
  port: 6379
  password: ruoyi123
  db: 0
  clientName: ruoyi-go        # 便于 CLIENT LIST 排查
  poolSize: 32
  minIdleConns: 8
  dialTimeoutMs: 5000
  readTimeoutMs: 3000
  writeTimeoutMs: 3000
  connMaxIdleTime: 600        # 空闲连接最大存活(秒)

# sa-token-go 鉴权配置
satoken:
  tokenName: Authorization          # 读取 token 的请求头名(对应 sa-token.token-name)
  isConcurrent: true                # 允许同一账号并发登录(多端在线)
  isShare: false                    # 多端登录是否共享同一 token
  jwtSecretKey: abcdefghijklmnopqrstuvwxyz # jwt秘钥

user:
  password:
    maxRetryCount: 5          # 达到即锁定
    lockTime: 10              # 锁定时长(分钟)

# 是否开启全局接口加密
apiEncrypt:
  enabled: true
  # AES 加密头标识
  headerFlag: encrypt-key
  # 响应加密公钥
  publicKey: MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDm6u8q8X78onmbU4wGMq3b4ufbWE18YzuWo5jwkUlwWPTPcENbZYtveyTepp2Od1CTDcjhTUmVYvFkhaCF46UfOxZrwoSZc3jf3WXXd0hLOPBHuulynknj2KsWvKDuRig7J2o4KbDhyl0nnlUiMrIiD0tv1rBKpNCJ/T+MN0bERQIDAQAB
  # 请求解密私钥
  privateKey: 

# 消息推送配置。对照原项目 message 段（本项目 sse / websocket 两种传输都已移植）。
# 跨域统一由 cors 段管，不另设 allowedOrigins 白名单。
push:
  enabled: true                 # 关闭则不注册推送路由，且发布消息直接跳过
  transport: sse                # sse / websocket，取值非法时回落 sse
  # 相对部分，注册时拼 prefix（对齐 Java：微服务版 nacos 把 message.path 覆盖成 /message）。
  # modular(prefix="") → /message，nginx 剥 /resource 后匹配；
  # standalone(prefix="/resource") → /resource/message，直连。
  # 前端两种部署都打 /resource/message。
  path: /message
  sseTimeoutSeconds: 86400      # SSE 连接超时(秒)，到点由服务端结束、前端重连
  heartbeatSeconds: 60          # 心跳间隔(秒)，同时用于剔除失效连接
  sendBuffer: 32                # 单连接待发消息缓冲；写满即断开该慢客户端

# xss 排除：modular system 的公告路由经 nginx 剥 /system 后是 /notice，须排除以免清洗破坏富文本。
xss:
  excludeUrls:
    - /notice                     # 富文本公告，清洗会破坏内容
    - /warm-flow/save-json        # 流程定义 JSON，需原样存标签
  skipMethods: [ GET, DELETE ]      # REST 语义不携带落库内容

# cors/accessLog/traceId/repeatableBody 走 Go 默认（DefaultX 兜底）。
